<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imlo Tekshiruvchisi</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --error-color: #EF4444;
            --success-color: #10B981;
            --background-color: #F3F4F6;
            --card-background: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--background-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-background);
            border-radius: 1rem;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 
                        0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            color: var(--text-primary);
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
        }

        h3 {
            color: var(--text-secondary);
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .example {
            background-color: var(--background-color);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 1.125rem;
            color: var(--text-primary);
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #E5E7EB;
            border-radius: 0.5rem;
            font-size: 1rem;
            min-height: 120px;
            margin-bottom: 1rem;
            transition: border-color 0.2s ease;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: #4338CA;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            text-align: center;
        }

        .correct {
            background-color: #ECFDF5;
            color: var(--success-color);
            border: 1px solid #A7F3D0;
        }

        .incorrect {
            background-color: #FEF2F2;
            color: var(--error-color);
            border: 1px solid #FECACA;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chiziqcha bilan yozish</h1>
        <h3>Gapni to'g'irlab qayta ko'chiring</h3>
        <div id="exampleSentence" class="example"></div>
        <textarea id="inputText" placeholder="Matnni bu yerga kiriting..."></textarea>
        <button onclick="checkText()">Tekshirish</button>
        <div id="result" class="result"></div>
    </div>
    <script>
        const examples = [
            { incorrect: "El yurt birlashib, katta bir maqsadga erishish uchun harakat qilishadi", correct: "El-yurt birlashib, katta bir maqsadga erishish uchun harakat qilishadi" },
            { incorrect: "Mehr shafqat odamning insoniy fazilatlaridan biridir", correct: "Mehr-shafqat odamning insoniy fazilatlaridan biridir" },
            { incorrect: "Ular uch to'rt soat vaqtlarini birgalikda o'tkazdilar", correct: "Ular uch-to'rt soat vaqtlarini birgalikda o'tkazdilar" },
            { incorrect: "O'n o'n beshta odam yig'ilishi bilan majlis boshlandi", correct: "O'n-o'n beshta odam yig'ilishi bilan majlis boshlandi" },
            { incorrect: "Bu o'zgarishlar bilinarbilinmas bo'lishi mumkin", correct: "Bu o'zgarishlar bilinar-bilinmas bo'lishi mumkin" },
            { incorrect: "Ich ichidan hamma o'zining orzulari amalga oshishini xohlaydi", correct: "Ich-ichidan hamma o'zining orzulari amalga oshishini xohlaydi" },
            { incorrect: " Bordi-keldi ishlar haqida ko'proq bilishni istayman", correct: " Bordi-keldi ishlar haqida ko'proq bilishni istayman" },
            
            { incorrect: "Maydachuyda ishlar bilan band bo'lishim kerakmas edi", correct: "Mayda-chuyda ishlar bilan band bo'lishim kerakmas edi" },
            { incorrect: "Kiyim kechakni alohida e'tibor bilan tanlang", correct: "Kiyim-kechakni alohida e'tibor bilan tanlang" },
            { incorrect: "Chopa chopa ishlash va tinimsiz mehnat qilish kerak", correct: "Chopa-chopa ishlash va tinimsiz mehnat qilish kerak" },
            { incorrect: "Baland baland tog'lar bilan o'ralgan qishloq juda go'zal", correct: "Baland-baland tog'lar bilan o'ralgan qishloq juda go'zal" },
            { incorrect: "Bitta bitta gapiringlar", correct: "Bitta-bitta gapiringlar" },
            { incorrect: "Qopqop mevalarni olib bozorga jo'nadi", correct: "Qop-qop mevalarni olib bozorga jo'nadi" },
            { incorrect: " Taqtuq tovushi yon tarafdan eshitildi", correct: " Taq-tuq tovushi yon tarafdan eshitildi" },
            ]; 
        let currentExampleIndex = -1;
        let currentExample = null;

        function getNextExample() {
            currentExampleIndex = (currentExampleIndex + 1) % examples.length;
            currentExample = examples[currentExampleIndex];
            document.getElementById("exampleSentence").textContent = `Xato shakl: ${currentExample.incorrect}`;
            return currentExample;
        }

        function checkText() {
            const inputText = document.getElementById('inputText').value.trim();
            const result = document.getElementById('result');
            
            if (!currentExample) {
                currentExample = getNextExample();
            }

            if (inputText === currentExample.correct) {
                result.innerHTML = `
                    <div class="correct">
                        <p>✓ To'g'ri! Keyingi gapga o'tishingiz mumkin.</p>
                    </div>
                `;
                document.getElementById('inputText').value = '';
                currentExample = getNextExample();
            } else {
                result.innerHTML = `
                    <div class="incorrect">
                        <p>✗ Xato. Iltimos, qaytadan urinib ko'ring.</p>
                    </div>
                `;
            }
        }

        // Initialize first example when page loads
        window.onload = function() {
            getNextExample();
        };
    </script>
</body>
</html>
