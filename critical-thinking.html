<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanqidiy Fikrlash - Psixologik Test</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #818cf8;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --background-color: #f8fafc;
            --card-background: #ffffff;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .container {
            background: var(--card-background);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            width: 100%;
            height: 0.5rem;
            background-color: #e2e8f0;
            border-radius: 0.25rem;
            margin-bottom: 1.5rem;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 0.25rem;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            color: #64748b;
            font-size: 0.875rem;
        }

        .question-card {
            background-color: #f8fafc;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            font-size: 1.125rem;
            color: #1e293b;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            min-height: 100px;
            display: flex;
            align-items: center;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            width: 100%;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            text-align: left;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #1e293b;
            font-family: inherit;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #f8fafc;
        }

        .option-btn.selected {
            border-color: var(--primary-color);
            background-color: #eef2ff;
            color: var(--primary-color);
            font-weight: 500;
        }

        .option-btn.correct {
            border-color: var(--success-color);
            background-color: #dcfce7;
            color: var(--success-color);
        }

        .option-btn.incorrect {
            border-color: var(--error-color);
            background-color: #fee2e2;
            color: var(--error-color);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        button {
            flex: 1;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        button.secondary {
            background-color: #64748b;
        }

        button.secondary:hover {
            background-color: #475569;
        }

        .feedback {
            text-align: center;
            font-size: 1rem;
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feedback.visible {
            opacity: 1;
        }

        .correct {
            background-color: #dcfce7;
            color: var(--success-color);
        }

        .incorrect {
            background-color: #fee2e2;
            color: var(--error-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h2 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .results-table th,
        .results-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .results-table th {
            color: var(--primary-color);
            font-weight: 600;
        }

        .score-display {
            text-align: center;
            margin: 1.5rem 0;
        }

        .score-number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .score-label {
            font-size: 1.25rem;
            color: #64748b;
            margin-top: 0.5rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .option-btn {
                padding: 0.875rem 1rem;
                font-size: 0.9375rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Tanqidiy Fikrlash</h1>
        <p class="subtitle">Qaror qabul qilish va tafakkur testi</p>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        
        <div class="stats">
            <span>Savol: <span id="current-question">1</span> / <span id="total-questions">60</span></span>
            <span>To'g'ri: <span id="correct-count">0</span></span>
            <span>Ball: <span id="score">0</span>%</span>
        </div>
        
        <div class="question-card" id="question"></div>
        
        <div class="options-container" id="options"></div>
        
        <div class="button-group">
            <button id="prev-btn" onclick="previousQuestion()" disabled>
                <i class="fas fa-arrow-left"></i>
                Oldingi
            </button>
            <button id="next-btn" onclick="nextQuestion()" disabled>
                <span id="next-text">Keyingi</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
        
        <div class="feedback" id="feedback"></div>
    </div>

    <div class="modal" id="results-modal">
        <div class="modal-content">
            <h2>🎉 Test Yakunlandi!</h2>
            
            <div class="score-display">
                <div class="score-number" id="final-score">0</div>
                <div class="score-label">ball</div>
            </div>
            
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Ko'rsatkich</th>
                        <th>Natija</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
            
            <button onclick="restartQuiz()" style="margin-top: 1.5rem; width: 100%;">
                <i class="fas fa-redo"></i>
                Qayta boshlash
            </button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let correctAnswers = 0;

        // Load questions
        async function loadQuestions() {
            try {
                const response = await fetch('critical-thinking.json');
                questions = await response.json();
                document.getElementById('total-questions').textContent = questions.length;
                showQuestion();
            } catch (error) {
                console.error('Savollarni yuklashda xatolik:', error);
                alert('Savollarni yuklashda xatolik yuz berdi!');
            }
        }

        function showQuestion() {
            if (currentIndex >= questions.length) {
                showResults();
                return;
            }

            const question = questions[currentIndex];
            
            // Update question
            document.getElementById('question').textContent = question.question;
            
            // Update stats
            document.getElementById('current-question').textContent = currentIndex + 1;
            const progress = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress').style.width = `${progress}%`;
            
            // Show options
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(index);
                
                if (userAnswers[currentIndex] === index) {
                    btn.classList.add('selected');
                }
                
                optionsContainer.appendChild(btn);
            });
            
            // Update buttons
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = userAnswers[currentIndex] === undefined;
            
            if (currentIndex === questions.length - 1) {
                document.getElementById('next-text').textContent = 'Yakunlash';
            } else {
                document.getElementById('next-text').textContent = 'Keyingi';
            }
            
            // Clear feedback
            document.getElementById('feedback').className = 'feedback';
        }

        function selectOption(optionIndex) {
            const question = questions[currentIndex];
            userAnswers[currentIndex] = optionIndex;
            
            // Update correct count
            if (optionIndex === question.correct) {
                if (userAnswers[currentIndex] !== optionIndex || correctAnswers === 0) {
                    correctAnswers++;
                }
            } else {
                if (userAnswers[currentIndex] === question.correct) {
                    correctAnswers--;
                }
            }
            
            // Update UI
            const options = document.querySelectorAll('.option-btn');
            options.forEach((btn, index) => {
                btn.classList.remove('selected', 'correct', 'incorrect');
                if (index === optionIndex) {
                    btn.classList.add('selected');
                }
            });
            
            // Show feedback
            const feedback = document.getElementById('feedback');
            if (optionIndex === question.correct) {
                feedback.textContent = 'Ajoyib! To\'g\'ri javob 👏';
                feedback.className = 'feedback correct visible';
            } else {
                feedback.textContent = 'To\'g\'ri javob: ' + question.options[question.correct];
                feedback.className = 'feedback incorrect visible';
            }
            
            // Update stats
            updateStats();
            
            // Enable next button
            document.getElementById('next-btn').disabled = false;
        }

        function updateStats() {
            document.getElementById('correct-count').textContent = correctAnswers;
            const score = Math.round((correctAnswers / Math.max(currentIndex + 1, 1)) * 100);
            document.getElementById('score').textContent = score;
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function previousQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                showQuestion();
            }
        }

        function showResults() {
            const totalQuestions = questions.length;
            const wrongAnswers = totalQuestions - correctAnswers;
            const percentage = Math.round((correctAnswers / totalQuestions) * 100);
            
            document.getElementById('final-score').textContent = percentage + '%';
            
            const resultsBody = document.getElementById('results-body');
            resultsBody.innerHTML = `
                <tr><td>Jami savollar</td><td>${totalQuestions}</td></tr>
                <tr><td>To'g'ri javoblar</td><td>${correctAnswers}</td></tr>
                <tr><td>Noto'g'ri javoblar</td><td>${wrongAnswers}</td></tr>
                <tr><td>Natija</td><td><strong>${percentage}%</strong></td></tr>
            `;
            
            document.getElementById('results-modal').style.display = 'flex';
        }

        function restartQuiz() {
            currentIndex = 0;
            userAnswers = [];
            correctAnswers = 0;
            document.getElementById('results-modal').style.display = 'none';
            showQuestion();
        }

        // Initialize
        loadQuestions();
    </script>
</body>
</html>
